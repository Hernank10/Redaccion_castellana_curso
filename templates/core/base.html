<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}El Archivo de Vector · LMS{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/vector.css' %}" />
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="{% url 'index' %}" class="nav-brand">
                <span class="brand-icon">⌛</span>
                <span class="brand-text">Archivo de Vector</span>
            </a>
        </div>
    </nav>
    <main class="main-content">{% block content %}{% endblock %}</main>
    <footer class="footer">
        <p>El Archivo de Vector · Cronista Temporal · 1000 técnicas de redacción</p>
    </footer>
</body>
</html>
