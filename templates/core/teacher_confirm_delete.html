{% extends 'core/base.html' %}
{% load i18n %}
{% block title %}Confirmar borrado{% endblock %}
{% block content %}
<div style="max-width:500px;margin:80px auto;padding:20px;">
    <div style="background:#1a1a2e;padding:35px;border-radius:16px;border:2px solid #ff4444;text-align:center;">
        <div style="font-size:3em;margin-bottom:15px;">⚠️</div>
        <h1 style="color:#fff;margin:0 0 15px;">Confirmar borrado</h1>
        <p style="color:#ccc;">¿Borrar {{ tipo }}:</p>
        <p style="color:#ff4444;font-size:1.2em;font-weight:bold;">{{ objeto }}</p>
        <p style="color:#888;font-size:.85em;">Esta accion no se puede deshacer.</p>
        <form method="post" style="margin-top:25px;">
            {% csrf_token %}
            <button type="submit" style="padding:12px 25px;background:#ff4444;color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;margin-right:10px;">🗑️ Borrar</button>
            <a href="{% url 'teacher_dashboard' %}" style="padding:12px 25px;background:#2a2a3e;color:#fff;border-radius:8px;text-decoration:none;font-weight:600;">← Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
