{% extends 'core/base.html' %}
{% load i18n %}
{% block title %}{{ accion }} leccion{% endblock %}

{% block extra_head %}
<link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">
<style>
#editor-container{background:#0f0f1e;border:1px solid #333;border-radius:0 0 8px 8px;min-height:400px;color:#fff;}
.ql-toolbar{background:#1a1a2e;border:1px solid #333 !important;border-radius:8px 8px 0 0;}
.ql-toolbar button,.ql-toolbar .ql-picker-label{color:#fff !important;}
.ql-toolbar button:hover,.ql-toolbar button.ql-active{color:#00d4ff !important;}
.ql-snow .ql-stroke{stroke:#ccc !important;}
.ql-snow .ql-fill{fill:#ccc !important;}
.ql-snow .ql-picker{color:#ccc !important;}
.ql-snow .ql-picker-options{background:#1a1a2e !important;border-color:#333 !important;}
.ql-snow .ql-picker-item{color:#ccc !important;}
.ql-editor{color:#fff;font-size:1em;line-height:1.6;}
.ql-editor h1,.ql-editor h2,.ql-editor h3{color:#00d4ff;}
.ql-editor a{color:#00d4ff;}
.ql-editor pre,.ql-editor code{background:#2a2a3e;color:#ffd700;padding:2px 6px;border-radius:4px;}
.ql-editor blockquote{border-left:3px solid #00d4ff;padding-left:15px;color:#aaa;}
.ql-editor img{max-width:100%;}
.tabs{display:flex;gap:5px;margin-bottom:10px;}
.tab{padding:8px 16px;background:#1a1a2e;border:1px solid #333;border-radius:8px;color:#aaa;cursor:pointer;font-weight:500;font-size:.9em;}
.tab.active{background:#00d4ff;color:#000;border-color:#00d4ff;}
#html-view{display:none;width:100%;padding:15px;background:#0f0f1e;border:1px solid #333;border-radius:8px;color:#fff;font-family:monospace;font-size:.9em;min-height:400px;box-sizing:border-box;resize:vertical;}
</style>
{% endblock %}

{% block content %}
<div style="max-width:900px;margin:40px auto;padding:20px;">
    <div style="background:#1a1a2e;padding:35px;border-radius:16px;border:1px solid #2a2a3e;">
        <h1 style="color:#fff;margin:0 0 10px;">📖 {{ accion }} leccion</h1>
        <p style="color:#888;margin-bottom:25px;">{{ curso.icon }} {{ curso.name }}</p>

        <form method="post" id="lesson-form">
            {% csrf_token %}

            <label style="color:#ccc;display:block;margin:15px 0 6px;font-weight:500;">Titulo</label>
            <input type="text" name="title" value="{{ leccion.title|default:'' }}" required
                style="width:100%;padding:12px;background:#0f0f1e;border:1px solid #333;border-radius:8px;color:#fff;font-size:1em;box-sizing:border-box;">

            <label style="color:#ccc;display:block;margin:20px 0 6px;font-weight:500;">Contenido</label>

            <div class="tabs">
                <div class="tab active" data-tab="visual">✏️ Editor Visual</div>
                <div class="tab" data-tab="html">&lt;/&gt; HTML</div>
            </div>

            <div id="visual-view">
                <div id="editor-container"></div>
            </div>
            <textarea id="html-view" spellcheck="false"></textarea>

            <input type="hidden" name="content" id="content-input" value="{{ leccion.content|default:''|escapejs }}">

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:20px;">
                <div>
                    <label style="color:#ccc;display:block;margin-bottom:6px;font-weight:500;">Orden</label>
                    <input type="number" name="order" value="{{ leccion.order|default:0 }}"
                        style="width:100%;padding:12px;background:#0f0f1e;border:1px solid #333;border-radius:8px;color:#fff;font-size:1em;box-sizing:border-box;">
                </div>
                <div>
                    <label style="color:#ccc;display:block;margin-bottom:6px;font-weight:500;">Dificultad</label>
                    <select name="difficulty"
                        style="width:100%;padding:12px;background:#0f0f1e;border:1px solid #333;border-radius:8px;color:#fff;font-size:1em;box-sizing:border-box;">
                        {% for key, label in dificultades %}
                        <option value="{{ key }}" {% if leccion.difficulty == key %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div style="display:flex;align-items:center;gap:10px;margin-top:15px;">
                <input type="checkbox" name="is_active" id="is_active" {% if leccion.is_active or not leccion %}checked{% endif %}>
                <label for="is_active" style="color:#ccc;margin:0;">Activa</label>
            </div>

            <div style="display:flex;gap:10px;margin-top:25px;">
                <button type="submit"
                    style="flex:1;padding:14px;background:linear-gradient(90deg,#00d4ff,#00ff88);border:none;border-radius:8px;color:#000;font-weight:600;font-size:1em;cursor:pointer;">
                    💾 Guardar
                </button>
                <a href="{% url 'teacher_course_lessons' curso.slug %}"
                    style="padding:14px 22px;background:#2a2a3e;color:#fff;border-radius:8px;text-decoration:none;font-weight:600;">
                    ← Cancelar
                </a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
<script>
(function(){
    const toolbarOptions = [
        [{ 'header': [1, 2, 3, false] }],
        ['bold', 'italic', 'underline', 'strike'],
        [{ 'color': [] }, { 'background': [] }],
        [{ 'list': 'ordered' }, { 'list': 'bullet' }],
        [{ 'indent': '-1' }, { 'indent': '+1' }],
        [{ 'align': [] }],
        ['blockquote', 'code-block'],
        ['link', 'image'],
        ['clean']
    ];

    const quill = new Quill('#editor-container', {
        theme: 'snow',
        modules: { toolbar: toolbarOptions },
        placeholder: 'Escribe el contenido de la leccion...'
    });

    const contentInput = document.getElementById('content-input');
    const htmlView = document.getElementById('html-view');
    const form = document.getElementById('lesson-form');
    const tabs = document.querySelectorAll('.tab');
    const visualView = document.getElementById('visual-view');

    // Cargar contenido inicial en Quill
    const initial = contentInput.value || '';
    if (initial) {
        quill.clipboard.dangerouslyPasteHTML(initial);
        htmlView.value = initial;
    }

    // Cambio de tabs
    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            tabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            const target = tab.dataset.tab;
            if (target === 'html') {
                htmlView.value = quill.root.innerHTML;
                visualView.style.display = 'none';
                htmlView.style.display = 'block';
            } else {
                quill.clipboard.dangerouslyPasteHTML(htmlView.value);
                visualView.style.display = 'block';
                htmlView.style.display = 'none';
            }
        });
    });

    // Sincronizar HTML al textarea al editar en HTML
    htmlView.addEventListener('input', () => {
        // No actualizar Quill hasta cambiar de tab
    });

    // Sincronizar antes de enviar
    form.addEventListener('submit', (e) => {
        const target = document.querySelector('.tab.active').dataset.tab;
        if (target === 'visual') {
            contentInput.value = quill.root.innerHTML;
        } else {
            contentInput.value = htmlView.value;
        }
    });

    console.log('Quill inicializado correctamente');
})();
</script>
{% endblock %}
